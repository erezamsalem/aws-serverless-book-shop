<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1, h2 {
            color: #333;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .form-container {
            margin: 20px;
        }
        .left-form {
            margin-right: auto;
        }
        .centered-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .centered-get-book {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
        }
        label, input {
            display: block;
            margin-bottom: 10px;
        }
        button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .centered-title {
            text-align: center;
        }
        #bookResult {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="centered-title">Book Management System</h1>

    <div class="container">
        <div class="form-container left-form">
            <h2>Add a New Book</h2>
            <form id="bookForm">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="authorFirstname">Author First Name:</label>
                <input type="text" id="authorFirstname" name="author_firstname" required>

                <label for="authorLastname">Author Last Name:</label>
                <input type="text" id="authorLastname" name="author_lastname" required>

                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn" name="isbn" required>

                <label for="format">Format:</label>
                <input type="text" id="format" name="format" required>

                <label for="description">Description:</label>
                <input type="text" id="description" name="description" required>

                <label for="price">Price:</label>
                <input type="number" step="0.01" id="price" name="price" required>

                <label for="imageUrl">Image URL:</label>
                <input type="text" id="imageUrl" name="imageUrl" required>

                <button type="submit">Add Book</button>
            </form>
        </div>

        <div class="form-container centered-get-book">
            <h2>Get a Book by ID</h2>
            <form id="getBookForm" class="centered-form">
                <label for="bookId">Book ID:</label>
                <input type="text" id="bookId" name="bookId" required>
                <button type="submit">Get Book</button>
            </form>

            <!-- Book details section -->
            <div id="bookResult"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
